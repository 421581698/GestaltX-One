name: Swift CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
