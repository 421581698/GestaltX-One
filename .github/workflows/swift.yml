name: Swift and iOS CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-ios-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Swift
        run: swift --version
      - name: Build core package
        run: swift build
      - name: Test core package
        run: swift test

  native-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify native console dependency
        run: test -f Vendor/GestaltX/Native/DeviceConsole/Cargo.toml
      - name: Test native console host configuration
        run: cargo test --locked --manifest-path Vendor/GestaltX/Native/DeviceConsole/Cargo.toml

  ios-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: xcodebuild -project GestaltXOne.xcodeproj -scheme GestaltXOne -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
