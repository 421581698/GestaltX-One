name: Swift and iOS CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-ios-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Swift
        run: swift --version
      - name: Build core package
        run: swift build
      - name: Test core package
        run: swift test

  native-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify native console dependency
        run: test -f Vendor/GestaltX/Native/DeviceConsole/Cargo.toml
      - name: Test native console host configuration
        run: cargo test --locked --manifest-path Vendor/GestaltX/Native/DeviceConsole/Cargo.toml

  native-console-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Vendor/GestaltX/Native/DeviceConsole
      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Install native build dependencies
        run: brew install cmake nasm
      - name: Build iOS device and simulator XCFramework
        run: Vendor/GestaltX/Native/DeviceConsole/build-xcframework.sh
      - name: Upload native XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: gx-device-console-xcframework
          path: Vendor/GestaltX/Native/DeviceConsole/build/GXDeviceConsole.xcframework
          if-no-files-found: error

  ios-app:
    needs: native-console-ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download native console XCFramework
        uses: actions/download-artifact@v4
        with:
          name: gx-device-console-xcframework
          path: Vendor/GestaltX/Native/DeviceConsole/build/GXDeviceConsole.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: xcodebuild -project GestaltXOne.xcodeproj -scheme GestaltXOne -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
