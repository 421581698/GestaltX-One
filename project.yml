name: GestaltXOne
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  GestaltXOneCore:
    path: .
targets:
  GestaltXOne:
    type: application
    platform: iOS
    sources:
      - App/GXDeviceConsoleRuntime.swift
      - App/GestaltXNativeMessageHandler.swift
      - App/GestaltXOneApp.swift
      - App/GestaltXWebView.swift
      - App/NativePairingCoordinator.swift
      - App/DeviceConsole.swift
      - App/NativePairingRecordStore.swift
      - App/PairableHostAdvertiser.swift
      - Vendor/GestaltX/GestaltX/Localization.swift
    dependencies:
      - framework: Vendor/GestaltX/Native/DeviceConsole/build/GXDeviceConsole.xcframework
        embed: false
      - package: GestaltXOneCore
        product: GestaltXOneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestaltx.one
        PRODUCT_NAME: GestaltXOne
        SWIFT_VERSION: "5.9"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GXDEVICECONSOLE"
        OTHER_LDFLAGS: "$(inherited) -lc++"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_GESTALTX_CONTROL_PLANE_URL: "https://configure-your-domain.example"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    info:
      path: App/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "GestaltX One advertises a temporary local pairing host so you can pair this iPhone through iOS Developer Mode."
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
